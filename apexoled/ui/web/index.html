<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ApexOLED Studio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo-mark"></div>
  <b>ApexOLED Studio</b>
  <span class="ver" id="ver"></span>
</header>

<main>
  <!-- ============ 左侧参数面板 ============ -->
  <aside id="panel">

    <section>
      <h3>素材</h3>
      <div id="dropzone">
        <b>拖拽文件到这里</b><br>或点击选择（图片 / GIF / 视频）
      </div>
      <div id="src-info" hidden></div>
      <div class="field" id="video-opts" hidden>
        <label>视频截取时长（秒，留空 = 全部）</label>
        <input type="number" id="in-duration" min="0.1" step="0.5" placeholder="全部">
      </div>
      <div class="field" id="crop-field" hidden>
        <label id="crop-label">框选区域：<code id="crop-val">未框选</code></label>
        <button class="ghost" id="btn-crop-clear" style="width:100%">清除框选（使用完整画面）</button>
      </div>
    </section>

    <section>
      <h3>画面适配</h3>
      <div class="field">
        <label>缩放模式</label>
        <div class="seg" id="seg-mode">
          <button data-v="cover" class="on" title="裁剪填满 128×40">cover 填满</button>
          <button data-v="fit" title="完整显示，空白补背景">fit 完整</button>
        </div>
      </div>
      <div class="field row2">
        <div>
          <label>fit 背景色</label>
          <select id="sel-bg">
            <option value="black">黑色</option>
            <option value="white">白色</option>
          </select>
        </div>
        <div>
          <label>增强</label>
          <select id="sel-enhance">
            <option value="none">关闭</option>
            <option value="light">轻度锐化</option>
            <option value="strong">强力锐化</option>
          </select>
        </div>
      </div>
      <div class="field checkline">
        <input type="checkbox" id="chk-logo">
        <span>白底 Logo 优化（白底压黑、彩字提亮）</span>
      </div>
    </section>

    <section>
      <h3>色彩</h3>
      <div class="field">
        <div class="seg" id="seg-colors">
          <button data-v="bw" class="on">黑白</button>
          <button data-v="gray">灰度</button>
          <button data-v="color">彩色</button>
        </div>
      </div>
      <div class="field">
        <label>调色板颜色数（灰度/彩色生效）</label>
        <div class="rangeval">
          <input type="range" id="rg-palette" min="2" max="256" step="2" value="256">
          <output id="out-palette">256</output>
        </div>
      </div>
      <div class="field">
        <label>抖动</label>
        <select id="sel-dither">
          <option value="auto">自动（推荐）</option>
          <option value="none">无抖动（最锐利）</option>
          <option value="bayer">棋盘纹理</option>
        </select>
      </div>
    </section>

    <section>
      <h3>效果动画（静态图）</h3>
      <div class="field row2">
        <div>
          <label>入场效果</label>
          <select id="sel-eff-in"></select>
        </div>
        <div>
          <label>方向</label>
          <select id="sel-eff-in-dir"></select>
        </div>
      </div>
      <div class="field row2">
        <div>
          <label>退场效果</label>
          <select id="sel-eff-out"></select>
        </div>
        <div>
          <label>方向</label>
          <select id="sel-eff-out-dir"></select>
        </div>
      </div>
      <div class="field">
        <label>帧率 FPS</label>
        <div class="rangeval">
          <input type="range" id="rg-fps" min="1" max="30" step="1" value="10">
          <output id="out-fps">10</output>
        </div>
      </div>
      <div class="metric-row">
        <div class="metric"><div class="k">进场 s</div><div class="v" id="m-in">0.8</div></div>
        <div class="metric"><div class="k">停留 s</div><div class="v" id="m-hold">1.6</div></div>
        <div class="metric"><div class="k">退场 s</div><div class="v" id="m-out">0.8</div></div>
        <div class="metric"><div class="k">间隔 s</div><div class="v" id="m-gap">0.4</div></div>
      </div>
      <div class="field" style="margin-top:8px">
        <input type="range" id="rg-tin"  min="0" max="5" step="0.1" value="0.8">
        <input type="range" id="rg-thold" min="0" max="5" step="0.1" value="1.6">
        <input type="range" id="rg-tout" min="0" max="5" step="0.1" value="0.8">
        <input type="range" id="rg-tgap" min="0" max="5" step="0.1" value="0.4">
      </div>
      <div class="field">
        <label>总帧数（上限 60，超出自动压缩）：<b id="frame-count" style="color:var(--accent)">36 帧</b></div>
      </div>
    </section>

    <section>
      <h3>导出</h3>
      <div class="field">
        <label>格式</label>
        <select id="sel-format">
          <option value="gif">GIF（动态）</option>
          <option value="png">PNG（静态）</option>
          <option value="jpg">JPG（静态）</option>
          <option value="bmp">BMP（静态）</option>
        </select>
      </div>
      <div class="field" id="quality-field" hidden>
        <label>JPG 质量</label>
        <div class="rangeval">
          <input type="range" id="rg-quality" min="40" max="100" step="1" value="92">
          <output id="out-quality">92</output>
        </div>
      </div>
      <button class="primary" id="btn-export">导出成品（预览即所得）</button>
    </section>

  </aside>

  <!-- ============ 右侧预览舞台 ============ -->
  <div id="stage">

    <div class="stage-card" id="crop-wrap" hidden>
      <h3>源图框选（在图上拖拽选择要上屏的区域）</h3>
      <canvas id="crop-canvas"></canvas>
      <div id="crop-hint">拖拽画出矩形 → 自动应用；「清除框选」恢复完整画面</div>
    </div>

    <div class="stage-card">
      <h3>OLED 实时预览（128 × 40）</h3>
      <div id="oled-row">
        <div class="oled-box">
          <div class="cap">1:1 真实尺寸</div>
          <canvas id="oled-1x" width="128" height="40"></canvas>
        </div>
        <div class="oled-box">
          <div class="cap">4x 放大</div>
          <canvas id="oled-4x" width="512" height="160"></canvas>
        </div>
      </div>
      <div id="player-bar" style="margin-top:12px">
        <button class="ghost" id="btn-prev" title="上一帧">|◀</button>
        <button class="primary" id="btn-play" style="height:30px">▶ 播放</button>
        <button class="ghost" id="btn-next" title="下一帧">▶|</button>
        <span id="frame-pos">-- / --</span>
        <span id="render-stats">等待素材…</span>
      </div>
    </div>

    <div class="stage-card" id="warn-card" hidden>
      <h3>提示</h3>
      <div id="warn-area"></div>
    </div>

  </div>
</main>

<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
