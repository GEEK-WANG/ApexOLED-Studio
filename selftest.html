<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ApexOLED Studio · 引擎自检</title>
<style>
  :root { --bg:#0e1014; --panel:#161a22; --border:#2a313d; --text:#e8ebf0; --muted:#8b93a3; --accent:#ff7a1a; --ok:#43d17c; --danger:#ff5d5d; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font:13px/1.55 system-ui,"Segoe UI","Microsoft YaHei",sans-serif; padding:22px 26px 40px; max-width:900px; margin:0 auto; }
  header { display:flex; align-items:baseline; gap:14px; margin-bottom:6px; }
  header b { font-size:16px; }
  header a { color:var(--muted); font-size:12px; text-decoration:none; }
  header a:hover { color:var(--accent); }
  #summary { margin-bottom:16px; font-size:13px; color:var(--muted); }
  #summary b { font-size:15px; }
  #summary.ok b { color:var(--ok); }
  #summary.bad b { color:var(--danger); }
  .group { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:10px 14px 12px; margin-bottom:14px; }
  .group h3 { font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; margin-bottom:6px; }
  .case { display:flex; gap:10px; padding:3px 4px; border-radius:5px; align-items:baseline; }
  .case:hover { background:#1c2129; }
  .case .mark { width:16px; text-align:center; font-weight:700; flex:none; }
  .case.pass .mark { color:var(--ok); }
  .case.fail .mark { color:var(--danger); }
  .case .name { font-family:Consolas,"Cascadia Mono",monospace; flex:none; }
  .case .note { color:var(--muted); font-size:12px; }
  .case.fail .note { color:var(--danger); font-size:12px; word-break:break-all; }
</style>
</head>
<body>
<header>
  <b>ApexOLED Studio · 引擎自检</b>
  <a href="index.html">← 返回工具</a>
</header>
<div id="summary">正在加载对拍 fixtures…</div>
<div id="groups"></div>
<script type="module" src="js/selftest.js"></script>
</body>
</html>
